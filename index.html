<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>To Aff</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Gaegu:wght@400;700&family=Mali:wght@400;600&display=swap">
<style>
/* Layout: one scrapbook card filling the screen; three scenes (envelope → letter → songs) swap inside it */
:root{
  --wine:#6b0f14; --wine-deep:#4a080c; --cream:#f3e7c4; --paper:#f8f0d8;
  --gingham:#c9262f; --ink:#3a1a12; --pink:#e88a9a;
  --f-script:"Dancing Script","Mali","Brush Script MT",cursive;
  --f-hand:"Gaegu","Mali","Comic Sans MS",system-ui,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;font-family:var(--f-hand);color:var(--ink);
  background:
    repeating-linear-gradient(0deg,rgba(201,38,47,.18) 0 22px,transparent 22px 44px),
    repeating-linear-gradient(90deg,rgba(201,38,47,.18) 0 22px,transparent 22px 44px),
    #e9dcb5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:clamp(16px,3vw,32px);
  display:flex;justify-content:center;align-items:center;
  min-height:100svh;
}
button,a{font-family:inherit;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:focus-visible,a:focus-visible{outline:3px dashed var(--cream);outline-offset:3px}

.card{
  position:relative;width:100%;max-width:960px;
  min-height:max(560px,calc(100svh - 64px));
  background:var(--wine);border-radius:6px;overflow:hidden;
  box-shadow:0 18px 40px rgba(60,10,10,.35),0 2px 0 #3b0609;
  display:flex;
}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.12;
  background-image:radial-gradient(#000 1px,transparent 1.2px);background-size:5px 5px}

.scene{position:relative;flex:1;padding:clamp(40px,6vw,64px) clamp(18px,4vw,44px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.4vw,22px);animation:pageIn .5s ease both}
@keyframes pageIn{from{transform:translateY(12px);opacity:.3}to{transform:none;opacity:1}}
.scene > *{position:relative;z-index:1}
.deco{position:absolute!important;z-index:0!important;pointer-events:none}

.gingham{background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.55) 0 14px,transparent 14px 28px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 14px,transparent 14px 28px),var(--gingham)}
.torn{background:var(--paper);
  clip-path:polygon(0 4%,8% 0,18% 5%,30% 1%,42% 6%,55% 0,66% 5%,78% 1%,90% 6%,100% 2%,100% 96%,90% 100%,78% 95%,66% 100%,55% 94%,42% 100%,30% 95%,18% 100%,8% 96%,0 100%)}
.news{background:repeating-linear-gradient(0deg,rgba(58,26,18,.22) 0 2px,transparent 2px 7px),#eadfc0}
.tape{position:absolute;width:76px;height:22px;background:rgba(243,231,196,.8);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.sticker{filter:drop-shadow(0 3px 0 rgba(255,255,255,.9)) drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.float{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}

.lead{color:var(--cream);font-size:clamp(20px,3.2vw,28px);margin:0;text-align:center;text-wrap:balance}
.big{font-size:clamp(28px,4.6vw,40px);font-weight:700;line-height:1}
.title{font-family:var(--f-script);color:var(--cream);font-size:clamp(32px,5vw,50px);margin:0;line-height:1.05;text-wrap:balance}

/* envelope */
.envelope{position:relative;width:clamp(200px,34vw,320px);aspect-ratio:3/2;max-width:100%;background:#f4f1ea;border-radius:4px;box-shadow:0 8px 18px rgba(0,0,0,.35);border:0;padding:0;transition:transform .2s}
.envelope::before{content:"";position:absolute;inset:0;background:
  linear-gradient(to top right,transparent 49.5%,#d9d4c8 50%,transparent 51%) left/50% 100% no-repeat,
  linear-gradient(to top left,transparent 49.5%,#d9d4c8 50%,transparent 51%) right/50% 100% no-repeat}
.envelope .flap{position:absolute;left:0;right:0;top:0;height:58%;background:#ebe7dd;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .5s;box-shadow:inset 0 -2px 0 #d9d4c8}
.envelope .seal{position:absolute;left:50%;top:50%;width:36px;height:34px;transform:translate(-50%,-30%)}
.envelope:active{transform:scale(.97)}
.envelope.opening .flap{transform:rotateX(180deg)}
@media (hover:hover){.envelope:hover .flap{transform:rotateX(28deg)}}
.envelope.small{width:clamp(150px,24vw,220px)}

.btns{display:flex;gap:clamp(14px,3vw,24px);flex-wrap:wrap;justify-content:center}
.tag{position:relative;min-width:110px;min-height:48px;background:var(--cream);color:var(--wine);border:0;font-size:22px;font-weight:700;letter-spacing:.12em;padding:6px 28px;box-shadow:3px 3px 0 var(--wine-deep);transition:transform .15s,box-shadow .15s}
.tag:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--wine-deep)}
@media (hover:hover){.tag:hover{transform:translate(-2px,-2px) rotate(-2deg);box-shadow:5px 5px 0 var(--wine-deep)}}
.tag.crossed{color:#a77;pointer-events:none}
.tag.crossed::after{content:"";position:absolute;left:10%;right:10%;top:50%;height:3px;background:#d1202b;transform:rotate(-12deg)}
.hint-arrow{color:var(--cream);font-size:18px;opacity:.8;margin:0}

/* letter */
.letter-wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,2fr);gap:clamp(20px,3vw,34px);width:100%;max-width:860px;align-items:center}
.letter{position:relative;background:var(--paper);padding:clamp(24px,4vw,36px) clamp(20px,4vw,36px);transform:rotate(.5deg);box-shadow:0 8px 18px rgba(0,0,0,.3);min-width:0}
.letter::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(107,15,20,.12) 31px 32px);pointer-events:none}
.letter h2{position:relative;font-family:var(--f-script);color:var(--wine);font-size:clamp(30px,4.4vw,42px);margin:0 0 12px;line-height:1.1}
.letter p{position:relative;font-size:clamp(18px,2.2vw,20px);line-height:1.6;margin:0;max-width:62ch;white-space:pre-line}
.letter .sign{position:relative;font-family:var(--f-script);font-size:clamp(24px,3vw,28px);color:var(--wine);text-align:right;margin-top:10px}

.next{display:inline-flex;align-items:center;gap:10px;min-height:48px;margin-top:14px;padding:8px 18px;background:var(--wine);color:var(--cream);border:0;font-size:19px;font-weight:700;box-shadow:3px 3px 0 var(--wine-deep);position:relative;transition:transform .15s}
.next:active{transform:translate(2px,2px)}
.next svg{width:20px;height:18px}

.film{background:#1b1412;padding:14px 24px;display:flex;flex-direction:column;gap:10px;position:relative;transform:rotate(-3deg);justify-self:center;width:100%;max-width:220px}
.film::before,.film::after{content:"";position:absolute;top:0;bottom:0;width:12px;background:repeating-linear-gradient(0deg,#f3e7c4 0 8px,transparent 8px 18px)}
.film::before{left:6px}.film::after{right:6px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo{overflow:hidden;aspect-ratio:4/3;max-width:100%;background:
  radial-gradient(ellipse 30% 14% at 30% 34%,#fff 60%,transparent 62%),
  radial-gradient(ellipse 22% 11% at 70% 26%,#fff 60%,transparent 62%),
  linear-gradient(#8fc3ea 0 62%,#7fb04a 62% 100%)}

/* songs */
.songs-wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,4vw,44px);width:100%;max-width:860px;align-items:center}
.track{display:flex;align-items:center;gap:12px;background:#3a3333;color:#f1eaea;padding:10px 12px;border-radius:8px;border:0;width:100%;min-height:64px;text-align:left;font-size:17px;text-decoration:none;transition:background .2s,transform .15s}
.track+.track{margin-top:10px}
.sp{display:block;width:100%;height:80px;border:0;border-radius:12px;background:#3a3333}
.sp+.sp{margin-top:10px}
.track:active{transform:scale(.98)}
.track.on{background:#7a1d24}
@media (hover:hover){.track:hover{background:#5a2026}}
.cover{width:46px;height:46px;flex:none;border-radius:5px;background:linear-gradient(135deg,var(--pink),var(--wine))}
.track .meta{min-width:0;flex:1}
.track b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .artist{opacity:.7;font-size:15px}
.play{width:36px;height:36px;border-radius:50%;background:#f1eaea;color:#3a3333;display:grid;place-items:center;font-size:13px;flex:none}
.vinyl-box{position:relative;justify-self:center;width:clamp(200px,32vw,320px);max-width:100%}
.vinyl{width:100%;aspect-ratio:1;border-radius:50%;position:relative;
  background:radial-gradient(circle,#c9262f 0 17%,#1a1a1a 17.5% 19%,#111 19% 100%);
  box-shadow:0 10px 24px rgba(0,0,0,.45)}
.vinyl::before{content:"";position:absolute;inset:4%;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 3px,rgba(255,255,255,.05) 3px 4px)}
.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:4%;height:4%;border-radius:50%;background:var(--cream);transform:translate(-50%,-50%)}
.vinyl.spin{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.now{color:var(--cream);font-size:17px;min-height:1.5em;margin:10px 0 0}
.cover{overflow:hidden}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.vlabel{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#c9262f center/cover no-repeat;z-index:1}
.vlabel::after{content:"";position:absolute;left:50%;top:50%;width:12%;aspect-ratio:1;border-radius:50%;background:var(--cream);transform:translate(-50%,-50%)}
.scene{z-index:1}
.player{margin-top:12px;border-radius:12px;overflow:hidden;min-height:152px;background:#2b2626}
.player iframe{display:block;width:100%;border:0}
.track .play{transition:transform .15s}

.back{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:14px;z-index:3!important;min-height:44px;background:var(--cream);color:var(--wine);border:0;font-size:17px;font-weight:700;padding:6px 16px;box-shadow:2px 2px 0 var(--wine-deep)}

/* iPad portrait & small tablets */
@media (max-width:900px){
  .letter-wrap{grid-template-columns:minmax(0,.7fr) minmax(0,2fr)}
  .songs-wrap{grid-template-columns:1fr;max-width:560px;gap:24px}
  .songs-wrap .vinyl-box{order:-1;width:clamp(200px,40vw,300px)}
  .songs-wrap .title,.now{text-align:center}
}
/* phones */
@media (max-width:640px){
  body{padding-block:12px}
  .card{min-height:calc(100svh - 24px)}
  #s-envelope .gingham{width:9%}
  #s-envelope .lead{padding-inline:6%}
  .scene{padding:64px 16px 32px;justify-content:center}
  .letter-wrap{grid-template-columns:1fr}
  .film{flex-direction:row;transform:rotate(-2deg);max-width:280px;padding:22px 12px;order:-1}
  .film::before,.film::after{left:0;right:0;top:auto;bottom:auto;width:auto;height:10px;background:repeating-linear-gradient(90deg,#f3e7c4 0 8px,transparent 8px 18px)}
  .film::before{top:5px}.film::after{bottom:5px}
  .film .photo{flex:1;aspect-ratio:3/4}
  .film{max-width:300px}
  .next{width:100%;justify-content:center}
  .songs-wrap{grid-template-columns:1fr;gap:20px}
  .songs-wrap .vinyl-box{order:-1;width:min(210px,58vw)}
  .songs-wrap .title{text-align:center}
  .now{text-align:center}
  .hide-sm{display:none!important}
}
/* short landscape phones */
@media (max-height:480px) and (orientation:landscape){
  .card{min-height:auto}
  .scene{padding-block:52px 24px}
  .envelope{width:180px}
  .hide-sm{display:none!important}
}

      <article class="letter">
        <div class="tape" style="left:42%;top:-10px;transform:rotate(-3deg)"></div>
        <h2 id="l-title"></h2>
        <p id="l-body"></p>
        <div class="sign" id="l-sign"></div>
        <button class="next" data-go="songs">Songs that remind me of you
          <svg viewBox="0 0 32 30" aria-hidden="true"><use href="#heart" fill="#e88a9a"/></svg></button>
      </article>
    </div>
  </section>

  <!-- 3. songs -->
  <section class="scene bg1" id="s-songs" hidden>
    <button class="back" data-go="letter">← letter</button>
    <div class="deco torn hide-sm" style="right:-10px;top:-6px;width:22%;height:30%;background:#e9e4dc"></div>
    <svg class="deco sticker float hide-sm" style="left:3%;bottom:5%;width:70px;height:75px" viewBox="0 0 60 64"><use href="#bear"/></svg>
    <svg class="deco sticker hide-sm" style="right:4%;bottom:6%;width:44px;height:50px" viewBox="0 0 36 40"><use href="#berry"/></svg>
    <div class="songs-wrap">
      <div style="min-width:0">
        <h2 class="title">Songs that<br>Remind Me of You</h2>
        <div id="tracks" style="margin-top:18px"></div>
        <div class="player" id="playerWrap"><div id="player"></div></div>
        <p class="now" id="now" aria-live="polite"></p>
      </div>
      <div class="vinyl-box">
        <div class="vinyl" id="vinyl"><div class="vlabel" id="vlabel"></div></div>
        <svg class="sticker" style="position:absolute;right:-10px;top:-8px;width:22%;aspect-ratio:1" viewBox="0 0 40 40"><use href="#flower"/></svg>
        <svg class="sticker" style="position:absolute;left:-4px;bottom:2px;width:16%;aspect-ratio:1" viewBox="0 0 40 40"><use href="#flower"/></svg>
      </div>
    </div>
  </section>
</main>

<script>
/* ===== Edit everything here ===== */
const GIFT = {
  title: "To Aff",
  body: "ขอบคุณแอฟที่เข้ามาในชีวิตเรานะ เรามีความสุขมากๆ ที่ได้คุยกับแอฟ ไม่ว่าแอฟจะต้องเจออะไร แอฟจะมีเราอยู่ข้างๆ เสมอนะ\nเราภูมิใจในตัวแอฟมากๆๆ\nอยู่กับเราแบบนี้ไปอีกนานๆ เลยนะๆๆๆๆ\nรักแอฟ",
  sign: "From Kao",
  songs: [
    {title:"love.", artist:"wave to earth", spotify:"5mtTAScDytxMMqZj14NmlN", cover:"https://image-cdn-ak.spotifycdn.com/image/ab67616d00001e0224f8c3ad20b7c6cfecb5832e"},
    {title:"Sure Thing", artist:"Miguel", spotify:"4I0N5wVMCgeA8Y7sULp1NE", cover:"https://image-cdn-fa.spotifycdn.com/image/ab67616d00001e0274fba4449d81f164f8182745"},
    {title:"Best Part", artist:"Daniel Caesar ft. H.E.R.", spotify:"1RMJOxR6GRPsBHL8qeC2ux", cover:"https://image-cdn-ak.spotifycdn.com/image/ab67616d00001e023138f891f3075c9c5d944037"}
  ]
};
/* "spotify" = the track ID from a Spotify share link: open.spotify.com/track/<ID> */

const $ = s => document.querySelector(s);
$("#l-title").textContent = GIFT.title;
$("#l-body").textContent = GIFT.body;
$("#l-sign").textContent = GIFT.sign;

const tracks = $("#tracks"), vinyl = $("#vinyl"), now = $("#now");
const uri = id => "spotify:track:" + id;
let controller = null, current = -1, playing = false;

/* custom song list: one row per song */
GIFT.songs.forEach((s,i)=>{
  const el = document.createElement("button");
  el.className = "track"; el.type = "button";
  el.innerHTML = `<span class="cover" style="${s.cover?"":`filter:hue-rotate(${i*35}deg)`}">${s.cover?`<img alt="" src="${s.cover}" onerror="this.remove()">`:""}</span><span class="meta"><b></b><span class="artist"></span></span><span class="play" aria-hidden="true">▶</span>`;
  el.querySelector("b").textContent = s.title;
  el.querySelector(".artist").textContent = s.artist;
  el.addEventListener("click", ()=>pick(i));
  tracks.appendChild(el);
});
function paint(){
  tracks.querySelectorAll(".track").forEach((t,i)=>{
    const on = i === current;
    t.classList.toggle("on", on);
    t.querySelector(".play").textContent = on && playing ? "❚❚" : "▶";
  });
  vinyl.classList.toggle("spin", playing);
  const cv = GIFT.songs[Math.max(current,0)].cover; if(cv) $("#vlabel").style.backgroundImage = `url("${cv}")`;
  now.textContent = current >= 0 ? (playing ? "Now playing: " : "Paused: ") + GIFT.songs[current].title : "";
}
/* ONE Spotify player for all songs, so two songs can never play at once */
function pick(i){
  if(!controller){ window.open("https://open.spotify.com/track/" + GIFT.songs[i].spotify, "_blank", "noopener"); return; }
  if(i === current){ controller.togglePlay(); return; }
  current = i; playing = false; paint();
  controller.loadUri(uri(GIFT.songs[i].spotify));
  controller.play();
}
window.onSpotifyIframeApiReady = API => {
  API.createController($("#player"), {uri: uri(GIFT.songs[0].spotify), width:"100%", height:152, theme:"dark"}, c => {
    controller = c;
    c.addListener("playback_update", e => {
      const d = e.data || {};
      const was = playing;
      playing = !d.isPaused && !d.isBuffering ? true : (d.isBuffering ? playing : false);
      if(current < 0 && playing) current = 0;
      if(was !== playing) paint();
    });
  });
};
paint();
const api = document.createElement("script");
api.src = "https://open.spotify.com/embed/iframe-api/v1"; api.async = true;
api.onerror = () => { $("#playerWrap").hidden = true; };
document.head.appendChild(api);

function go(name){
  document.querySelectorAll(".scene").forEach(s=>s.hidden = s.id !== "s-"+name);
  if(name !== "songs" && controller && playing){ controller.pause(); }
  window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-go]"); if(!t) return;
  const env = t.classList.contains("envelope") ? t : null;
  if(env && t.dataset.go==="letter"){ env.classList.add("opening"); setTimeout(()=>{env.classList.remove("opening"); go("letter");}, 420); }
  else go(t.dataset.go);
});
</script>
